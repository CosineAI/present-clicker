<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Typing Sprint – Keyboard Speed Game</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Typing Sprint</h1>
      <p class="subtitle">How fast can you type for 30 seconds?</p>
    </header>

    <section class="stats">
      <div class="stat">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="time-remaining">30.0s</span>
      </div>
      <div class="stat">
        <span class="stat-label">Words per minute</span>
        <span class="stat-value" id="wpm">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Accuracy</span>
        <span class="stat-value" id="accuracy">100%</span>
      </div>
    </section>

    <section class="quote-panel" aria-live="polite" aria-atomic="true">
      <p id="prompt" class="prompt"></p>
    </section>

    <section class="input-panel">
      <label for="typing-input" class="visually-hidden">Typing area</label>
      <textarea
        id="typing-input"
        class="typing-input"
        rows="4"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        placeholder="Press Start and begin typing here…"
      ></textarea>
      <div class="buttons">
        <button id="start-button" class="primary-button" type="button">Start</button>
        <button id="reset-button" class="secondary-button" type="button">Reset</button>
      </div>
    </section>

    <section class="results" aria-live="polite">
      <h2 class="results-title">Last run</h2>
      <p id="results-text" class="results-text">No runs yet – press Start to play.</p>
    </section>

    <footer class="app-footer">
      <p>Tip: Focus on accuracy first. Speed follows.</p>
    </footer>
  </main>

  <script src="assets/script.js"></script>
</body>
</html>
